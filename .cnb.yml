# 温故（siyuan-plugin-wengu）· CNB 流水线配置
#
# ⚠️ 本文件读取的是「仓库默认分支」的配置，默认分支必须始终保持为 `dev`。
#
# 顶层 key 有三套语义（详见 CNB 文档）：
#   1) `$`       —— 兜底 key，所有**未被分支 glob 命中**的分支都走它；NPC 事件挂这里。
#   2) 分支 glob —— 如 `dev`、`dev/*`、`(main|dev)`，按「触发分支」匹配。
#   3) 角色名    —— 仅对 NPC 生效：被 @ 的角色名与顶层 key **逐字一致**时才加载，
#                   并以 include 语义与 `$` 合并，**同名事件覆盖 `$` 下的同名事件**。
#                   必须与 .cnb/settings.yml 的 npc.roles[].name 完全一致，
#                   不要带 @ 前缀、不要带括号。
#
# ⚠️⚠️ 为什么本文件**没有** `dev:` 顶层节点（关键坑，请勿「顺手优化」掉）：
#   分支匹配是「分支级独占」，不是「事件级回落」——系统先做 glob 匹配，
#   **只有前一阶段未匹配时才会进入 `$` 兜底**（trigger-rule.md「匹配策略」）。
#   一旦新增 `dev:`，dev 就**不再走 `$`**；而两个 NPC 事件
#   （issue.comment@npc 跑在默认分支 dev、pull_request.comment@npc 跑在
#   PR 目标分支 dev）全部挂在 `$` 下 —— 后果是**召唤 NPC 毫无反应、
#   且不报任何错**，极难排查。故质量门也一并配在 `$` 下与 NPC 事件共存。
#
# 关于「双跑」：`pull_request` 事件的触发时机含「源分支 push」，因此给已开 PR 的
#   分支推提交会同时触发 push 与 pull_request 两条质检流水线。这是有意为之 ——
#   push 那条还兼着「合并进 dev 后复验」与「基础设施改动直接推 dev」两件事，
#   代价是多花一次构建时长（依赖安装为主），换来的是合并后不再有验证盲区。
#
# 计费口径：NPC 消耗「云原生开发」用量。这里的两个模型在缓存命中率 ≥95% 时
# 参考价均约 ¥0.00/MTok，属最省档。

# ── $ 兜底节点：质量门（所有分支）+ NPC 事件（所有角色默认模型）──
$:
  # 质量门：push 与 PR 自动跑四件套（Issue #1）
  # node:24 对应 package.json 的 engines.node >= 24；corepack 自 Node 25 起才从
  # 发行版移除，24 LTS 仍自带，故 `corepack enable` 即可按 packageManager 字段
  # 激活 pnpm@11.4.0，无需额外装 pnpm。
  push:
    - name: quality-gate
      docker:
        image: node:24
      stages:
        - name: install
          script: "corepack enable && pnpm install --frozen-lockfile"
        # 检查顺序：由快到慢，尽早失败、省时长。
        # 注意第二项用 `pnpm exec eslint .` 而非 `pnpm lint` —— 后者是
        # `eslint . --fix --cache`，在 CI 里会把违规**直接改掉再退出 0**，
        # 门禁形同虚设。本地仍用 `pnpm lint` 自动修，两不冲突。
        - name: check
          script: "pnpm format:check && pnpm exec eslint . && pnpm check:svelte && pnpm test"

  # PR：创建 / 重新打开 / 源分支 push 时跑同一套质量门
  pull_request:
    - name: quality-gate
      docker:
        image: node:24
      stages:
        - name: install
          script: "corepack enable && pnpm install --frozen-lockfile"
        - name: check
          script: "pnpm format:check && pnpm exec eslint . && pnpm check:svelte && pnpm test"

  issue.comment@npc:
    default:
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go
          options:
            model: deepseek-v4.1-flash
            thinkingLevel: high # 可选 off/minimal/low/medium/high/xhigh/max

  pull_request.comment@npc:
    default:
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go
          options:
            model: deepseek-v4.1-flash
            thinkingLevel: high

# ── 复核：代码审查角色，改用 glm-5.3-flash ──
复核:
  issue.comment@npc:
    default:
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go
          options:
            model: glm-5.3-flash
            thinkingLevel: high

  pull_request.comment@npc:
    default:
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go
          options:
            model: glm-5.3-flash
            thinkingLevel: high
